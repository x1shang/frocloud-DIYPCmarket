name: check-csv

# 数据校验 = 这个仓库的 CI。
#
# 触发方式：
#   1. 提交信息【含 (prerelease)】—— 例如
#        git commit -m "data-2026-11 (prerelease) [handmade-xlsx]"
#      （用 contains 而不是 endsWith：手工改过 xlsx 的提交还要在末尾带
#        [handmade-xlsx] 标记，两个标记的先后顺序不该影响 CI 是否运行。）
#   2. 手动：Actions 页面 → check-csv → Run workflow
#
# 为什么不用 schedule：数据是月更、"更新到几月"取决于有没有采到，
# 定时任务很容易在"这个月就是没更"的时候红掉，反而变成噪声。
# 想手动确认一次数据是否仍然合规，点 Run workflow 即可。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    # 只认"提交信息包含 (prerelease)"的 push；手动触发不做这个限制。
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '(prerelease)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 守卫要对比本次 push 改了哪些文件，需要完整历史
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install --quiet openpyxl

      - name: 守卫 —— 机器不许碰 frocloud.xlsx
        # 规则：工作簿是纯手搓的设计稿。脚本只准读它。
        # 人工编辑请在提交信息里带 [handmade-xlsx]。
        #
        # 注意区分两种情况，不能混：
        #   · git diff 退出码 0 = 没改；1 = 改了；其它/报错 = 没法比（不要当成"改了"）
        run: |
          BASE="${{ github.event.before }}"
          case "$BASE" in
            ''|0000000000000000000000000000000000000000) BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')" ;;
          esac
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::拿不到可对比的父提交（$BASE），xlsx 守卫本次跳过。"
            exit 0
          fi

          set +e
          git diff --quiet "$BASE" "${{ github.sha }}" -- frocloud.xlsx
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "frocloud.xlsx 未改动 ✓"
            git log -1 --pretty='  本次提交：%h %s'
            exit 0
          fi
          if [ "$rc" != "1" ]; then
            echo "::warning::git diff 返回 $rc，无法判断 frocloud.xlsx 是否改动，守卫跳过。"
            exit 0
          fi

          msg="$(git log -1 --pretty=%B)"
          case "$msg" in
            *"[handmade-xlsx]"*)
              echo "frocloud.xlsx 有改动，且提交信息带 [handmade-xlsx] 标记 —— 视为人工编辑 ✓"
              ;;
            *)
              echo "::error::frocloud.xlsx 被改动了，但提交信息里没有 [handmade-xlsx] 标记。"
              echo "规则：这份工作簿纯手搓，任何脚本都不得写入它。"
              echo "如果你确实是在 WPS/Excel 里手工改的，请在提交信息里加上 [handmade-xlsx] 重试。"
              exit 1
              ;;
          esac

      - name: 导出 CSV 到临时目录（顺带验证表头没有漂移）
        # export_csv.py 遇到没登记过的表头列会直接报错，并指出是哪一列
        # 注意：刻意写进临时目录而不是 data/，这一步就不会碰到工作区里的任何文件
        run: python tools/export_csv.py --out-dir /tmp/fresh-csv

      - name: 回归测试（合并单元格标签必须物化）
        run: python tools/test_materialize.py

      - name: 校验仓库里的 CSV
        run: python tools/check_csv.py -v

      - name: 检查 data/*.csv 是否与 frocloud.xlsx 同步
        # 只比"重新导出的结果"和"提交进仓库的 CSV"：
        # 一致 → 说明 data/ 没有手改、也没落后于 xlsx。
        # 这一步不牵扯 README / AGENTS.md 等任何其他文件。
        run: |
          set +e
          diff -rq /tmp/fresh-csv data/ > /tmp/csv-diff.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "data/*.csv 与 frocloud.xlsx 一致 ✓（重新导出后无任何差异）"
            exit 0
          fi
          echo "::error::data/*.csv 与 frocloud.xlsx 不一致 —— 可能是手工改了 CSV，或改了 xlsx 后忘了重新导出"
          cat /tmp/csv-diff.txt
          echo "正确做法：本地跑 python tools/export_csv.py，把 data/ 的变化一起提交"
          exit 1

      - name: 数据新鲜度（超过 45 天未更新只警告，不失败）
        shell: python
        run: |
          import datetime as dt, glob, csv, re
          latest = None
          for p in glob.glob("data/*-prices.csv"):
              with open(p, encoding="utf-8-sig") as f:
                  for row in csv.DictReader(f):
                      m = re.match(r"^(\d{4})-(\d{2})", row["date"])
                      if not m:
                          continue
                      d = dt.date(int(m.group(1)), int(m.group(2)), 1)
                      latest = d if latest is None or d > latest else latest
          if latest is None:
              raise SystemExit("没读到任何价格数据")
          days = (dt.date.today() - latest).days
          print("最新数据月份：%s（%d 天前）" % (latest.strftime("%Y-%m"), days))
          if days > 45:
              print("::warning::数据已 %d 天未更新，是不是漏了一次月更？" % days)
